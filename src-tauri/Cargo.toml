[package]
name = "bigrocketcamp-direct"
version = "0.1.0"
description = "Sends Rocket League final scoreboards from this PC to Big Rocket Camp"
license = "MIT"
edition = "2024"
rust-version = "1.85"
publish = false

[[bin]]
name = "bigrocketcamp-direct"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.5"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
