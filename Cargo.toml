[package]
name = "bigrocketcamp-collector"
version = "0.6.1"
description = "Sends Rocket League final scoreboards from this PC to Big Rocket Camp"
license = "MIT"
repository = "https://github.com/mousrockets/bigrocketcamp-collector"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
ureq = { version = "3.5.1", default-features = false, features = ["native-tls-no-default"] }
sha2 = "0.11.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# Build scripts run on the build machine: the resources are only compiled for a Windows target (build.rs).
[build-dependencies]
winresource = "0.1.34"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
