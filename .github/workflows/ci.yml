# Checks and builds the Windows installer on every push; a `v*` tag also publishes it in a release,
# with the SHA256SUMS the collector checks before installing an update.
# Actions are pinned to a commit, not a tag, so that a moved tag can never change what runs here.
name: CI

# Every branch of a pull request lives in this repository, so `push` already covers them.
on:
  push:
    branches: ["**"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update && rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Read the version
        id: version
        run: echo "version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"
      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $VERSION in Cargo.toml"
            exit 1
          fi
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
        env:
          # A fork sets the APP_URL repository variable to build for its own instance.
          APP_URL: ${{ vars.APP_URL }}
      - name: Measure the collector for 20 seconds
        shell: pwsh
        run: |
          $exe = Get-Item target/release/bigrocketcamp-collector.exe
          "Executable: {0:N0} KB" -f ($exe.Length / 1KB)
          $process = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 20
          $process.Refresh()
          if ($process.HasExited) { throw "The collector stopped by itself (exit code $($process.ExitCode))." }
          "Working set: {0:N1} MB, private memory: {1:N1} MB, threads: {2}, CPU time: {3:N3} s" -f `
            ($process.WorkingSet64 / 1MB), ($process.PrivateMemorySize64 / 1MB), $process.Threads.Count, $process.TotalProcessorTime.TotalSeconds
          "Priority: {0}" -f $process.PriorityClass
          # What Task Manager shows by default: the private working set, without shared system libraries.
          $private = (Get-Counter "\Process($($exe.BaseName))\Working Set - Private").CounterSamples[0].CookedValue
          "Private working set: {0:N1} MB" -f ($private / 1MB)
          Stop-Process -Id $process.Id
      - name: Build the installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DVersion=$env:VERSION" installer\collector.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Installer: {0:N0} KB" -f ((Get-Item BigRocketCampCollector-setup.exe).Length / 1KB)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: BigRocketCampCollector-setup.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # SHA256SUMS lets the collector check an update before running it.
        run: |
          sha256sum BigRocketCampCollector-setup.exe > SHA256SUMS
          cat SHA256SUMS
          gh release create "$GITHUB_REF_NAME" BigRocketCampCollector-setup.exe SHA256SUMS --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
